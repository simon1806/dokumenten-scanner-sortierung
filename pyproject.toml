[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dokumenten-scanner-sortierung"
version = "0.3.2"
description = "Automatische Trennung und Benennung eingescannter Betriebsdokumente."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "PyMuPDF>=1.28.2",
    "pypdf>=6.16.2",
    "pytesseract>=0.3.10",
    "pystray>=0.19.5",
    "zxing-cpp>=3.1.1",
]

[project.scripts]
dokumentensortierer = "scanner_sorter.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scanner_sorter = ["assets/app/*", "assets/icons/tabler/*.png"]

[tool.ruff.lint]
# Preserve the pre-0.16 default gate explicitly; Ruff 0.16 expanded its
# implicit defaults from 59 to 413 rules.
select = ["E4", "E7", "E9", "F"]
